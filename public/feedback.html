<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f7f9; margin:0; }
    .wrap { max-width:600px; margin:30px auto; background:#fff; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.08); padding:20px 24px; }
    h1 { margin:0 0 12px; }
    label { display:block; margin-top:12px; }
    input, textarea { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; }
    textarea { min-height:120px; }
    button { margin-top:16px; padding:10px 16px; border:0; border-radius:8px; background:#2563eb; color:#fff; font-weight:600; cursor:pointer; }
    .msg { margin-top:12px; color:green; display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Contact Us</h1>
    <form id="form">
      <label>Name</label>
      <input name="name" required>
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Message</label>
      <textarea name="message" required></textarea>
      <button type="submit">Send</button>
      <button type="button" class="secondary" id="backStore">Back to Store</button>
      <div class="msg" id="msg">Thanks for your feedback!</div>
    </form>
  </div>

  <script>
    document.getElementById('form').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());
      const res = await fetch('/api/feedback', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if (res.ok) {
        document.getElementById('msg').style.display='block';
        e.target.reset();
      } else {
        alert('Failed to send feedback');
      }
    };
    document.getElementById('backStore').onclick = () => {
        window.location.href = '/store.html';
    };

  </script>
<script src="/nav.js"></script>
<script>renderNav('Feedback');</script>
</body>
</html>
