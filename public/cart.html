<!-- public/cart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f2f2f2; }
    h1 { margin-top: 0; }
    .cart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .item { background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.1); padding:12px; display:flex; gap:12px; align-items:center; }
    .item img { width:96px; height:96px; object-fit:cover; border-radius:6px; }
    .meta { flex:1; }
    .meta h3 { margin:0 0 6px; font-size:16px; }
    .meta p { margin:2px 0; color:#555; font-size:14px; }
    .remove { background:#dc3545; color:white; border:none; border-radius:4px; padding:8px 10px; cursor:pointer; }
    .remove:hover { background:#b02a37; }
    .summary { margin: 16px 0; font-weight: bold; }
    .topnav { margin-bottom: 16px; }
    .topnav a { margin-right: 10px; }
  </style>
</head>
<body>

  <h1>Your Cart</h1>
  <div class="summary" id="summary"></div>
  <div class="cart-grid" id="cartList"></div>

  <script>
    async function ensureLoggedIn() {
      const res = await fetch('/api/check-login');
      const { loggedIn } = await res.json();
      if (!loggedIn) {
        window.location.href = '/login.html';
        throw new Error('Not logged in');
      }
    }

    async function loadProducts() {
      const res = await fetch('/products.json'); // relative to /public
      return await res.json();
    }

    async function loadCart() {
      const res = await fetch('/api/cart');
      return await res.json();
    }

  function money(n){ return `$${(Number(n)||0).toFixed(2)}`; }

async function renderCart() {
  await ensureLoggedIn();

  const [products, cartResp] = await Promise.all([loadProducts(), loadCart()]);
  const listEl = document.getElementById('cartList');
  const summaryEl = document.getElementById('summary');
  listEl.innerHTML = '';

  if (!cartResp.ok) {
    listEl.textContent = cartResp.error || 'Failed to load cart';
    return;
  }

  const idToProduct = new Map(products.map(p => [String(p.id), p]));
  const items = cartResp.items || [];
  if (!items.length) { summaryEl.textContent = 'Your cart is empty.'; return; }

  let total = 0;

  items.forEach(it => {
    const p = idToProduct.get(String(it.id));
    if (!p) return;

    // base price + optional print extra
    let unit = Number(p.price) || 0;
    if (it.print) unit += Number(it.print.extra || 5);
    total += unit;

    const prodImg = p.image ? (p.image.startsWith('http') ? p.image : `/${p.image}`) : '';

    const printUI = it.print ? `
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        ${it.print.image ? `<img src="${it.print.image}" alt="${it.print.type}"
             style="width:44px;height:44px;border-radius:6px;object-fit:cover;">` : ''}
        <div>
          <strong>Print:</strong> ${it.print.type} (${it.print.color})
          · +${money(Number(it.print.extra || 5))}
        </div>
      </div>
    ` : '';

    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      ${prodImg ? `<img src="${prodImg}" alt="${p.title}">` : ''}
      <div class="meta">
        <h3>${p.title}</h3>
        <p>${p.description || ''}</p>
        ${it.size ? `<p><strong>Size:</strong> ${it.size}</p>` : ''}
        ${printUI}
        <p style="margin-top:6px;"><strong>${money(unit)}</strong></p>
      </div>
      <button class="remove" data-id="${p.id}">Remove</button>
    `;
    listEl.appendChild(row);
  });

  summaryEl.textContent = `Items: ${items.length} · Total: ${money(total)}`;

  // remove
  listEl.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = btn.getAttribute('data-id');
      const res = await fetch(`/api/cart/${pid}`, { method: 'DELETE' });
      const data = await res.json().catch(()=>({}));
      if (!res.ok || !data.ok) { alert(data.error || 'Failed to remove item'); return; }
      renderCart();
    });
  });
}


    renderCart().catch(console.error);
  </script>
  <script src="/nav.js"></script>
  <script>renderNav('Cart');</script>
</body>
</html>
