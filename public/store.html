<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }

    #searchInput {
      width: 300px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product h3 {
      margin: 10px 0 5px;
    }

    .product p {
      font-size: 14px;
      color: #555;
    }

    .add-to-cart {
      margin-top: 10px;
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-to-cart:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div id="topnav"></div>
  <input type="text" id="searchInput" placeholder="Search products..." />
  <div class="product-grid" id="productList"></div>

  <script>
    async function loadProducts() {
      const res = await fetch('products.json');
      const products = await res.json();
      return products;
    }


    function renderProducts(products) {
      const container = document.getElementById('productList');
      container.innerHTML = '';

      products.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${product.image}" alt="${product.title}" />
          <h3>${product.title}</h3>
          <p>${product.description}</p>
          <p><strong>${product.price != null ? `$${product.price}` : ''}</strong></p>

          <label style="display:block;margin-top:8px;font-size:13px;color:#444;">Size</label>
          <select id="size-${product.id}" class="size-select" style="width:100%;padding:6px;">
            <option value="">-- Select size --</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
          </select>

          <button class="add-to-cart" onclick="handleAddToCart('${product.id}', '${product.title}')">
            Add to Cart
          </button>
        `;
        container.appendChild(div);
      });
    }

    async function handleAddToCart(productId, productTitle) {
  // 1) login check
    const res = await fetch('/api/check-login');
    const { loggedIn } = await res.json();

    if (!loggedIn) {
      alert('You must be logged in to add to cart');
      window.location.href = '/login.html';
      return;
    }

  // 2) require a size
    const select = document.getElementById(`size-${productId}`);
    const size = select ? select.value : '';
    if (!size) {
      alert('Please choose a size before adding to cart.');
      if (select) select.focus();
      return;
    }

    // 3) add to cart with size
    const addRes = await fetch('/api/cart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productId, size })
    });

    const data = await addRes.json().catch(() => ({}));
    if (!addRes.ok || !data.ok) {
      alert(data.error || 'Failed to add to cart');
      return;
    }

    alert(`${productTitle} (${size}) added to cart`);
  }


    document.getElementById('searchInput').addEventListener('input', async function() {
      const term = this.value.toLowerCase();
      const products = await loadProducts();
      const filtered = products.filter(p => 
        p.title.toLowerCase().startsWith(term) || 
        p.description.toLowerCase().startsWith(term)
      );
      renderProducts(filtered);
    });

    loadProducts().then(renderProducts);
  </script>
  <script src="/nav.js"></script>
  <script>renderNav('Store');</script>
</body>
</html>
